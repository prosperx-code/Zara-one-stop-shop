<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Selection | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'">Zara one stop shop</div>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop Catalog</a>
      <a href="cart.html" style="color:var(--marigold);">Selection (<span class="cart-counter-node">0</span>)</a>
    </nav>
  </header>

  <main class="fade-in" id="cart-page-wrapper" style="max-width:900px; margin:40px auto; padding:0 20px;">
    <h1 style="margin-bottom:8px; font-size:1.9rem;">Your Selection</h1>
    <p style="opacity:0.7; margin-bottom:28px;">Review items and place your order via WhatsApp.</p>

    <div id="cart-items-stack" style="display:flex; flex-direction:column; gap:16px; margin-bottom:28px;"></div>

    <div style="background:var(--white); padding:24px; border-radius:var(--radius); box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:18px;">
      <div>
        <p style="font-size:1rem; opacity:0.75;">Grand Total</p>
        <h2 style="font-family:'IBM Plex Mono',monospace; color:var(--teal); font-size:1.8rem;" id="cart-grand-total">₦0</h2>
      </div>
      <button class="btn-primary" style="padding:15px 32px; font-size:1.05rem;" onclick="processWhatsAppOrder()">
        Order via WhatsApp 🚀
      </button>
    </div>
  </main>

  <div class="mobile-nav">
    <a href="index.html">🏠 Home</a>
    <a href="shop.html">🛍️ Shop</a>
<a href="cart.html">
  <span>🛒</span>
  <span>Cart (<span class="cart-counter-node">0</span>)</span>
</a>    
<a href="contact.html">📞 Contact</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCartPage() {
      const root = document.getElementById('cart-items-stack');
      const totalNode = document.getElementById('cart-grand-total');
      if (!root) return;

      root.innerHTML = '';
      let accumulativeSum = 0;

      if (!AppState.cart || AppState.cart.length === 0) {
        root.innerHTML = `
          <div style="text-align:center; padding:48px 24px; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);">
            <p style="font-size:1.1rem; margin-bottom:12px;">Your selection is empty</p>
            <a href="shop.html" class="btn-primary" style="display:inline-block; margin-top:8px;">Browse Catalog</a>
          </div>`;
        totalNode.innerText = '₦0';
        return;
      }

      AppState.cart.forEach(item => {
        const product = AppState.products.find(p => p.id === item.id);
        if (!product) return;

        const rowCost = product.newPrice * item.qty;
        accumulativeSum += rowCost;

        const row = document.createElement('div');
        row.style.cssText = 'background:var(--white); padding:16px; border-radius:var(--radius); display:flex; align-items:center; gap:18px; box-shadow:var(--shadow); flex-wrap:wrap;';
        row.innerHTML = `
          <img src="${product.img}" style="width:72px; height:72px; object-fit:cover; border-radius:10px;">
          <div style="flex:1; min-width:180px;">
            <h3 style="font-size:1.05rem; margin-bottom:4px;">${product.name}</h3>
            <span class="price-tag" style="font-size:1rem;">₦${Number(product.newPrice).toLocaleString()}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="number" value="${item.qty}" min="1" style="width:70px; text-align:center; padding:8px;"
                   onchange="updateSelectionQty(${product.id}, this.value)">
            <button class="btn-secondary" style="background:var(--clay); color:white; padding:8px 14px; font-size:0.85rem;"
                    onclick="removeFromSelection(${product.id})">Remove</button>
          </div>
        `;
        root.appendChild(row);
      });

      totalNode.innerText = `₦${accumulativeSum.toLocaleString()}`;
    }

    function processWhatsAppOrder() {
      if (!AppState.cart || AppState.cart.length === 0) {
        showToast('Your selection is empty.', 'error');
        return;
      }

      const number = (typeof WHATSAPP_NUMBER !== 'undefined' && WHATSAPP_NUMBER)
        ? WHATSAPP_NUMBER
        : '2349028209111';

      let message = "Hello Zara One Stop Shop! I'd like to place an order:\n\n";
      let totalSum = 0;

      AppState.cart.forEach((item, index) => {
        const p = AppState.products.find(prod => prod.id === item.id);
        if (p) {
          const lineCost = p.newPrice * item.qty;
          totalSum += lineCost;
          message += `${index + 1}. ${p.name} (Qty: ${item.qty}) — ₦${lineCost.toLocaleString()}\n`;
        }
      });

      message += `\n*Grand Total:* ₦${totalSum.toLocaleString()}`;

      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/${number}?text=${encoded}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (AppState.products.length === 0) await loadProducts();
      renderCartPage();
    });
  </script>
</body>
</html>
