<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">Zara one stop shop</div>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Join Zara</h2>
      <p style="text-align:center; opacity:0.7; margin-bottom:28px;">Create an account to manage selections easily.</p>

      <form id="register-form" style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Full Name</label>
          <input type="text" id="reg-name" required>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Email Address</label>
          <input type="email" id="reg-email" required>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="e.g. 0803 000 0000" required>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Create Password</label>
          <input type="password" id="reg-pass" required minlength="6">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Confirm Password</label>
          <input type="password" id="reg-confirm" required>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:8px; width:100%;">Create Account</button>
      </form>

      <p style="margin-top:22px; text-align:center; font-size:0.95rem;">
        Already registered? <a href="signin.html" style="color:var(--teal); font-weight:600; text-decoration:underline;">Sign in</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const confirmPass = document.getElementById('reg-confirm').value;

      if (pass.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }
      if (pass !== confirmPass) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      AppState.user = { name, email, phone };
      localStorage.setItem('zara_shop_session', JSON.stringify(AppState.user));

      showToast('Account created successfully!', 'success');
      setTimeout(() => location.href = 'shop.html', 1000);
    });
  </script>
</body>
</html>
