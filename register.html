<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Details | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">Zara one stop shop</div>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Your Details</h2>
      <p style="text-align:center; opacity:0.7; margin-bottom:28px;">
        Save your name and phone number on this device so they are added to your WhatsApp orders.
        There is no password and nothing is sent to our servers.
      </p>

      <form id="details-form" style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Full Name</label>
          <input type="text" id="reg-name" required maxlength="80">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="e.g. 0803 000 0000" required maxlength="20">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Email (optional)</label>
          <input type="email" id="reg-email" maxlength="120">
        </div>
        <button type="submit" class="btn-primary" style="margin-top:8px; width:100%;">Save details</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Fill the form if details were saved before
      if (AppState.user) {
        document.getElementById('reg-name').value = AppState.user.name || '';
        document.getElementById('reg-phone').value = AppState.user.phone || '';
        document.getElementById('reg-email').value = AppState.user.email || '';
      }
    });

    document.getElementById('details-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();

      if (!name || !phone) {
        showToast('Enter your name and phone number.', 'error');
        return;
      }

      AppState.user = { name, phone, email };
      localStorage.setItem('zara_shop_session', JSON.stringify(AppState.user));

      showToast('Details saved.', 'success');
      setTimeout(() => (location.href = 'shop.html'), 900);
    });
  </script>
</body>
</html>
