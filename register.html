<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">Zara one stop shop</div>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop Catalog</a>
      <a href="cart.html">Selection (<span class="cart-counter-node">0</span>)</a>
      <span id="profile-nav-anchor" style="display:flex; align-items:center;"></span>
    </nav>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Create your account</h2>
      <p style="text-align:center; opacity:0.7; margin-bottom:28px;">Save your details once and order faster.</p>

      <form id="register-form" style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Full Name</label>
          <input type="text" id="reg-name" required maxlength="80" autocomplete="name">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="e.g. 0803 000 0000" required maxlength="20" autocomplete="tel">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Email Address</label>
          <input type="email" id="reg-email" required maxlength="120" autocomplete="email">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Password (at least 8 characters)</label>
          <input type="password" id="reg-pass" required minlength="8" maxlength="72" autocomplete="new-password">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Confirm Password</label>
          <input type="password" id="reg-confirm" required minlength="8" maxlength="72" autocomplete="new-password">
        </div>
        <button type="submit" id="reg-btn" class="btn-primary" style="margin-top:8px; width:100%;">Create Account</button>
      </form>

      <div id="register-done" style="display:none; text-align:center; line-height:1.6;"></div>

      <p style="margin-top:22px; text-align:center; font-size:0.95rem;">
        Already registered? <a href="signin.html" style="color:var(--teal); font-weight:600; text-decoration:underline;">Sign in</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabaseClient) {
        showToast('Accounts are not available right now.', 'error');
        return;
      }

      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const pass = document.getElementById('reg-pass').value;
      const confirmPass = document.getElementById('reg-confirm').value;

      if (pass.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
      if (pass !== confirmPass) { showToast('Passwords do not match.', 'error'); return; }

      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password: pass,
          options: {
            data: { name, phone },
            emailRedirectTo: new URL('signin.html', location.href).href
          }
        });
        if (error) throw error;

        if (data.session) {
          // Email confirmation is switched off: the user is already signed in
          showToast('Account created. Welcome!', 'success');
          setTimeout(() => (location.href = 'shop.html'), 900);
        } else {
          document.getElementById('register-form').style.display = 'none';
          const done = document.getElementById('register-done');
          done.style.display = 'block';
          done.textContent = 'Almost done! We sent a confirmation link to your email. Open it (check your spam folder too), then sign in.';
        }
      } catch (err) {
        showToast(err.message || 'Could not create the account. Try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
