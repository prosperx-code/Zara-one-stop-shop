<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">Zara one stop shop</div>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop Catalog</a>
      <a href="cart.html">Selection (<span class="cart-counter-node">0</span>)</a>
      <span id="profile-nav-anchor" style="display:flex; align-items:center;"></span>
    </nav>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Welcome back</h2>
      <p style="text-align:center; opacity:0.7; margin-bottom:28px;">Sign in to your account.</p>

      <form id="signin-form" style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Email Address</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Password</label>
          <input type="password" id="login-pass" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn-primary" style="margin-top:8px; width:100%;">Sign In</button>
      </form>

      <p style="margin-top:18px; text-align:center; font-size:0.95rem;">
        <a href="#" id="forgot-link" style="color:var(--teal); font-weight:600; text-decoration:underline;">Forgot password?</a>
      </p>
      <p style="margin-top:10px; text-align:center; font-size:0.95rem;">
        New here? <a href="register.html" style="color:var(--teal); font-weight:600; text-decoration:underline;">Create an account</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabaseClient) { showToast('Accounts are not available right now.', 'error'); return; }

      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-pass').value;
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const unconfirmed = /confirm/i.test(error.message || '');
        showToast(unconfirmed ? 'Please confirm your email first. Check your inbox.' : 'Wrong email or password.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        document.getElementById('login-pass').value = '';
        return;
      }

      showToast('Signed in. Welcome back!', 'success');
      setTimeout(() => (location.href = 'shop.html'), 800);
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      if (!supabaseClient) return;
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      if (!email) { showToast('Type your email above first.', 'error'); return; }

      await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: new URL('reset-password.html', location.href).href
      });
      // Same message whether or not the email has an account
      showToast('If that email has an account, a reset link is on its way.', 'success');
    });
  </script>
</body>
</html>
