<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">Zara one stop shop</div>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Welcome Back</h2>
      <p style="text-align:center; opacity:0.7; margin-bottom:28px;">Sign in to manage your selections.</p>

      <form id="signin-form" style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Email Address</label>
          <input type="email" id="login-email" required>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Password</label>
          <input type="password" id="login-pass" required>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:8px; width:100%;">Sign In</button>
      </form>

      <p style="margin-top:22px; text-align:center; font-size:0.95rem;">
        New here? <a href="register.html" style="color:var(--teal); font-weight:600; text-decoration:underline;">Create an account</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('signin-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();

      // Lightweight guest-style session (full Supabase user auth can be added later)
      AppState.user = { name: 'Valued Customer', email, phone: '' };
      localStorage.setItem('zara_shop_session', JSON.stringify(AppState.user));

      showToast('Welcome back!', 'success');
      setTimeout(() => location.href = 'shop.html', 900);
    });
  </script>
</body>
</html>
