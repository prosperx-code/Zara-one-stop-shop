<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Reset Password | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Zara one stop shop</a>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop Catalog</a>
      <a href="about.html">Our Story</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">🛒 Selection (<span class="cart-counter-node">0</span>)</a>
      <span id="profile-nav-anchor" style="display:flex; align-items:center; gap:4px;"></span>
    </nav>
    <a href="cart.html" class="header-cart" aria-label="Open your cart">🛒 <span class="cart-counter-node">0</span></a>
  </header>

  <main class="fade-in">
    <div class="form-container">
      <p class="back-link"><a href="shop.html">← Back to store</a></p>
      <h2 style="font-size:1.9rem; margin-bottom:6px; text-align:center;">Choose a new password</h2>
      <p id="reset-status" style="text-align:center; opacity:0.7; margin-bottom:20px;">Checking your reset link…</p>

      <form id="reset-form" style="display:none; flex-direction:column; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">New password (at least 8 characters)</label>
          <input type="password" id="new-pass" required minlength="8" maxlength="72" autocomplete="new-password">
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <label style="font-weight:600;">Confirm new password</label>
          <input type="password" id="new-confirm" required minlength="8" maxlength="72" autocomplete="new-password">
        </div>
        <button type="submit" id="reset-btn" class="btn-primary" style="margin-top:8px; width:100%;">Save new password</button>
      </form>
    </div>
  </main>

  <div class="mobile-nav">
    <a href="index.html"><span>🏠</span><span>Home</span></a>
    <a href="shop.html"><span>🛍️</span><span>Shop</span></a>
    <a href="about.html"><span>📖</span><span>Story</span></a>
    <a href="contact.html"><span>📞</span><span>Contact</span></a>
    <a href="signin.html" class="active" id="mobile-account-link"><span>👤</span><span>Sign In</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    function showResetForm() {
      document.getElementById('reset-status').textContent = 'Enter your new password.';
      document.getElementById('reset-form').style.display = 'flex';
    }

    // Register right away so the recovery event is not missed
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') showResetForm();
      });
    }

    setTimeout(() => {
      if (document.getElementById('reset-form').style.display !== 'flex') {
        document.getElementById('reset-status').textContent =
          'This link is invalid or has expired. Go to Sign In and tap "Forgot password?" for a new one.';
      }
    }, 6000);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('new-pass').value;
      if (pass.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
      if (pass !== document.getElementById('new-confirm').value) { showToast('Passwords do not match.', 'error'); return; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: pass });
      if (error) {
        showToast(error.message || 'Could not save the password.', 'error');
        btn.disabled = false;
        return;
      }
      showToast('Password updated.', 'success');
      setTimeout(() => (location.href = 'shop.html'), 900);
    });
  </script>
</body>
</html>
