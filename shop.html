<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Shop Catalog | Zara One Stop Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Zara one stop shop</a>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop Catalog</a>
      <a href="about.html">Our Story</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">🛒 Selection (<span class="cart-counter-node">0</span>)</a>
      <span id="profile-nav-anchor" style="display:flex; align-items:center; gap:4px;"></span>
    </nav>
    <a href="cart.html" class="header-cart" aria-label="Open your cart">🛒 <span class="cart-counter-node">0</span></a>
  </header>

  <main class="fade-in" style="max-width:1240px; margin:40px auto; padding:0 20px; display:grid; grid-template-columns:280px 1fr; gap:36px;">
    
    <!-- Filters -->
    <aside class="filters" style="background:var(--white); padding:24px; border-radius:var(--radius); box-shadow:var(--shadow); height:fit-content; position:sticky; top:90px;">
      <div style="margin-bottom:24px;">
        <h3 style="margin-bottom:10px; font-size:1.1rem;">Search</h3>
        <input type="text" id="search-input" placeholder="What are you looking for?">
      </div>
      <div>
        <h3 style="margin-bottom:10px; font-size:1.1rem;">Categories</h3>
        <select id="category-filter">
          <option value="All">All Categories</option>
          <option value="Kitchen">Kitchen Essentials</option>
          <option value="Kids">Kids & School</option>
          <option value="Home & Living">Home & Living</option>
          <option value="Gadgets">Smart Devices & Tech</option>
        </select>
      </div>
    </aside>

    <!-- Products -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <h2 style="font-size:1.6rem;">Live Catalog</h2>
        <span id="result-count" style="font-size:0.9rem; opacity:0.65;"></span>
      </div>
      <div id="shop-product-grid" class="product-grid"></div>
    </section>
  </main>

  <div class="mobile-nav">
    <a href="index.html"><span>🏠</span><span>Home</span></a>
    <a href="shop.html" class="active"><span>🛍️</span><span>Shop</span></a>
    <a href="about.html"><span>📖</span><span>Story</span></a>
    <a href="contact.html"><span>📞</span><span>Contact</span></a>
    <a href="signin.html" id="mobile-account-link"><span>👤</span><span>Sign In</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('shop-product-grid').innerHTML = skeletonCards(6);
      await loadProducts();
      renderShopCatalogItems();

      document.getElementById('search-input').addEventListener('input', renderShopCatalogItems);
      document.getElementById('category-filter').addEventListener('change', renderShopCatalogItems);
    });

    function renderShopCatalogItems() {
      const grid = document.getElementById('shop-product-grid');
      const countEl = document.getElementById('result-count');
      if (!grid) return;

      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
      const catVal = document.getElementById('category-filter').value;

      const filtered = AppState.products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(searchVal);
        const matchCat = catVal === 'All' || p.category === catVal;
        return matchSearch && matchCat;
      });

      if (countEl) countEl.textContent = `${filtered.length} item${filtered.length !== 1 ? 's' : ''}`;

      grid.innerHTML = filtered.length
        ? filtered.map(renderProductCard).join('')
        : '<p style="grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--gray);">No products match your filters.</p>';
    }
  </script>

  <style>
    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr !important;
      }
      aside {
        position: static !important;
      }
    }
  </style>
</body>
</html>
